
package:
  name: dv-flow-libhdlsim

  dep-sets:

  - name: default-dev
    deps:
    - name: pytest
      src: pypi
    - name: svdep
      url: https://github.com/fvutils/svdep.git
      dep-set: default
    - name: dv-flow-mgr
      url: http://github.com/dv-flow/dv-flow-mgr.git
    - name: pytest-dfm
      url: https://github.com/dv-flow/pytest-dfm.git
    - name: ply 
      src: pypi
    - name: pydantic
      src: pypi
    - name: toposort
      src: pypi
    - name: pyyaml
      src: pypi
    - name: Sphinx
      src: pypi
    - name: sphinx-jsonschema
      src: pypi
    - name: sphinxcontrib-mermaid
      src: pypi
    - { name: verilator, src: gh-rls, cache: true, url: https://github.com/edapack/verilator-bin }
    - { name: iverilog, src: gh-rls, cache: true, url: https://github.com/edapack/iverilog-bin }
    - { name: xezim, src: gh-rls, cache: true, url: https://github.com/edapack/xezim-bin }

  - name: default
    deps:
    - name: pytest
      src: pypi
    - name: svdep
      url: https://github.com/fvutils/svdep.git
    - name: dv-flow-mgr
      url: http://github.com/dv-flow/dv-flow-mgr.git
    - name: pytest-dfm
      url: https://github.com/dv-flow/pytest-dfm.git
    - name: ply 
      src: pypi
    - name: pydantic
      src: pypi
    - name: toposort
      src: pypi
    - name: pyyaml
      src: pypi
    - name: Sphinx
      src: pypi
    - name: sphinx-jsonschema
      src: pypi
    - name: sphinxcontrib-mermaid
      src: pypi

  env:
  - name: PATH
    path-prepend: "${IVPM_PACKAGES}/verilator/bin:${IVPM_PACKAGES}/iverilog/bin"

